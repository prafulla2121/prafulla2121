roke-opacity=".6"/><text x="660" y="191" text-anchor="middle" class="tag" fill="#B9A6FF">build</text><line x1="660" y1="200" x2="660" y2="208" stroke="#A79DB8" stroke-opacity=".5" stroke-width="2"/><rect x="580" y="208" width="160" height="26" rx="13" fill="#B9A6FF" fill-opacity="0.12" stroke="#B9A6FF" stroke-opacity=".6"/><text x="660" y="225" text-anchor="middle" class="tag" fill="#B9A6FF">review</text><line x1="660" y1="234" x2="660" y2="242" stroke="#A79DB8" stroke-opacity=".5" stroke-width="2"/><rect x="580" y="242" width="160" height="26" rx="13" fill="#B9A6FF" fill-opacity="0.12" stroke="#B9A6FF" stroke-opacity=".6"/><text x="660" y="259" text-anchor="middle" class="tag" fill="#B9A6FF">QA</text><text x="756" y="157" class="body" style="font-size:12px">a human approves</text><text x="756" y="173" class="body" style="font-size:12px">the plan first</text></svg>