<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211a2e"/><stop offset="1" stop-color="#161220"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#FF8A65" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A65"/><stop offset="1" stop-color="#B9A6FF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<radialGradient id="halo"><stop offset="0" stop-color="#FF8A65" stop-opacity=".35"/><stop offset="1" stop-color="#FF8A65" stop-opacity="0"/></radialGradient>
</defs>
<style>
.pipe{fill:none;stroke:#4a3f5e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:8 400;animation:flow 3.2s linear infinite}
@keyframes flow{from{stroke-dashoffset:408}to{stroke-dashoffset:0}}
.bob{animation:bob 5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.name{font:700 40px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F3EEF8;letter-spacing:-.5px}
.role{font:500 17px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F3EEF8}
.body{font:400 15px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A79DB8}
.tag{font:600 12px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
@media (prefers-reduced-motion:reduce){.flow,.bob,.spin{animation:none}}
